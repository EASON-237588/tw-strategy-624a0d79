<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>台股策略分析</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{--bg:#0f1419;--panel:#171e26;--panel2:#1e2731;--line:#2a3542;--tx:#e6edf3;--sub:#8b98a5;--red:#ff5b5b;--green:#3ddc84;--yellow:#ffd600;--blue:#4aa8ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0b1015;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
.bv{font-family:Consolas,monospace;font-size:13px;color:var(--yellow);font-weight:700}
.tabs{display:flex;gap:4px}
.tabs button{background:var(--panel2);color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:14px}
.tabs button.on{background:var(--blue);color:#001b33;border-color:var(--blue);font-weight:700}
.ver{margin-left:auto;font-size:11px;color:var(--sub);white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:12px}
.search{position:relative}
#q{width:100%;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--tx);outline:none}
#q:focus{border-color:var(--blue)}
.sug{position:absolute;left:0;right:0;top:100%;z-index:6;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:50vh;overflow:auto}
.sug div{padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
.sug div:last-child{border-bottom:0}
.sug b{color:var(--yellow);font-family:Consolas,monospace;margin-right:8px}
.sug i{color:var(--sub);font-style:normal;font-size:12px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px 10px;font-size:13px;color:var(--tx)}
.chip.on{border-color:var(--yellow);color:var(--yellow)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.head .nm{font-size:22px;font-weight:700}
.head .id{font-family:Consolas,monospace;color:var(--sub)}
.head .px{margin-left:auto;font-family:Consolas,monospace;font-size:20px}
.star{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:3px 8px;font-size:13px}
.star.on{color:var(--yellow);border-color:var(--yellow)}
.sig{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);margin-top:8px}
.badge{font-weight:700;border-radius:8px;padding:6px 10px;color:#fff;white-space:nowrap;font-size:16px}
.badge.long{background:#c62828}.badge.flat{background:#1b7f3b}.badge.short{background:#1565c0}
.sig .t{font-size:13px;color:var(--sub);line-height:1.5}
.sig .t b{color:var(--tx)}
.main .badge{font-size:20px;padding:8px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv{background:var(--panel2);border-radius:8px;padding:8px}
.kv .k{font-size:11px;color:var(--sub)}
.kv .v{font-family:Consolas,monospace;font-size:16px;margin-top:2px}
.up{color:var(--red)}.dn{color:var(--green)}.mut{color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600}
td{font-family:Consolas,"Microsoft JhengHei",monospace}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
canvas{width:100%;height:240px;display:block}
.kst{color:var(--yellow);font-size:13px;font-weight:700;white-space:nowrap}
.rb{background:var(--panel2);color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;margin-left:3px}
.rb.on{color:#001b33;background:var(--blue);border-color:var(--blue);font-weight:700}
.legend{font-size:11px;color:var(--sub);margin-top:4px}
.legend span{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}
details{margin-top:8px}
summary{color:var(--blue);font-size:13px;cursor:pointer}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.warn{background:#3a2a00;border:1px solid #6b5200;color:#ffe08a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px;line-height:1.6}
.grade{font-weight:700;border-radius:8px;padding:3px 10px;font-size:14px}
.grade.g3{background:#c62828;color:#fff}.grade.g2{background:#8a6d00;color:#fff}.grade.g1{background:#37474f;color:#cfd8dc}
ul.pts{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.7}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.btn{background:var(--blue);color:#001b33;border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.row .nm{font-weight:700}
.row .sub{font-size:12px;color:var(--sub);margin-top:2px}
.row .badge{font-size:14px;padding:5px 8px}
.row .r{margin-left:auto;text-align:right;font-family:Consolas,monospace;font-size:13px}
/* 總表分格（2026-10-26）：兩欄，格高平分「畫面高－標題列－上下留白」，13 檔一頁放得下不用捲 */
#pg-all:not([hidden]){display:flex;flex-direction:column;height:calc(100dvh - var(--toph,50px) - 24px);min-height:420px}
#pg-all .bar{flex:none;margin-bottom:6px}
#allNote{font-size:11px;line-height:1.4}
#allOut{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;cursor:pointer;min-width:0}
.tile.on{border-color:rgba(255,91,91,.7)}
.tile .t1{display:flex;align-items:center;gap:5px;min-width:0}
.tile .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{font-size:11px;padding:1px 5px;flex:none}
.tile .ln{font-size:11.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ln.err{padding:0}
.tile .two{font-weight:400;color:var(--yellow)}
/* 觀察用（2026-10-26）：主策略保護不了的檔，總表名稱旁小標籤、個股頁標題下一行提醒 */
.obs{flex:none;font-size:10.5px;color:var(--yellow);border:1px solid var(--yellow);border-radius:5px;padding:0 4px;line-height:16px}
.obsw{margin:8px 0 4px;padding:8px 10px;border:1px solid var(--yellow);border-radius:8px;background:rgba(255,214,0,.08);font-size:13px;line-height:1.6}
.obsw b{color:var(--yellow)}
.loading{color:var(--sub);padding:20px;text-align:center}
.err{color:#ff8a80;padding:12px}
.foot{max-width:760px;margin:0 auto;padding:10px 12px 24px;font-size:11px;color:var(--sub);line-height:1.7}
@media (max-width:420px){
  .brand{font-size:15px}.tabs button{padding:5px 9px;font-size:13px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .head .nm{font-size:19px}.head .px{font-size:17px}
  table{font-size:12px}
  .row{flex-wrap:wrap}
  .row .r{margin-left:0;flex-basis:100%;text-align:left;padding-left:52px;display:flex;gap:10px;flex-wrap:wrap}
}
#newver{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;background:#d32f2f;color:#fff;font-weight:700;text-align:center;padding:14px;border-radius:12px;font-size:16px;box-shadow:0 4px 18px rgba(0,0,0,.5);animation:nvb 1.2s ease-in-out infinite alternate}
@keyframes nvb{from{opacity:1}to{opacity:.75}}
.cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--yellow);color:#000;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.tabs button.blink{animation:chb 1s ease-in-out infinite;border-color:#ff5b5b}
@keyframes chb{0%,100%{background:#c62828;color:#fff}50%{background:var(--panel2);color:var(--yellow)}}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pick .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pick .nm{font-size:18px;font-weight:700}.pick .id{color:var(--sub);font-family:Consolas,monospace}
.pick .px{margin-left:auto;font-family:Consolas,monospace;font-size:16px}
.pick .ln{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
.pick .ln b{color:var(--tx)}
.rej{font-size:12px;color:var(--sub);line-height:1.8}
</style>
</head>
<body>
<header class="top">
  <div class="brand">台股策略分析 <span class="bv" id="bv"></span></div>
  <nav class="tabs"><button data-pg="all" class="on">總表</button><button data-pg="one">個股</button><button data-pg="chance" id="tabChance">有機會做多<span class="cnt" id="chCnt" hidden></span></button></nav>
</header>

<main>
  <section id="pg-one" class="pg" hidden>
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="輸入代號或名稱，例如 2330、台積電">
      <div id="sug" class="sug" hidden></div>
    </div>
    <div id="chips" class="chips"></div>
    <div id="out"></div>
  </section>

  <section id="pg-chance" class="pg" hidden>
    <div id="chOut"><div class="loading">讀取每日掃描結果…</div></div>
  </section>

  <section id="pg-all" class="pg">
    <div class="bar">
      <div class="note" id="allNote">自選清單每一檔的主策略（RF 只做多）目前狀態。</div>
      <button id="allRun" class="btn">更新總表</button>
    </div>
    <div id="allOut"></div>
  </section>
</main>

<footer class="foot">
  <div>資料：FinMind（日線、除權息、財報）。股價以除權息結果自行還原；收盤成交、每筆來回扣 0.38%。</div>
  <div>這是用自己的策略做的數據評估，不是投資建議。</div>
  <div id="ver2"></div>
</footer>

  <h2>策略進出<span class="kst">${esc(STRATS[0].name)}</span><span class="r note">${m.all.n} 筆，新的在上</span></h2>
  <div class="scroll"><table><thead><tr><th>進場</th><th>價</th><th>出場</th><th>價</th><th>報酬</th></tr></thead><tbody>${tr}</tbody></table></div>
  <div class="note">價格為還原價，跟券商畫面上的原始價不同。</div>
</div>`;
  }
  function finHTML(id, F) {
    const G = grade(F), y0 = F.years[0], y1 = F.years[F.years.length - 1];
    const seq = (a, d) => a.map(v => v === null ? '—' : v.toFixed(d === undefined ? 0 : d)).join(' → ');
    const kv = (k, v, c) => `<div class="kv"><div class="k">${k}</div><div class="v ${c || ''}">${v}</div></div>`;
    return `<h2>財報優勢<span class="grade ${G.lv[1]}">體質 ${G.lv[0]}</span><span class="r note">${y0}～${y1}</span></h2>
  <div class="grid">
    ${kv('ROE（最新／平均）', (G.roe === null ? '—' : G.roe.toFixed(0) + '%') + '／' + (G.roeA === null ? '—' : G.roeA.toFixed(0) + '%'))}
    ${kv('營收五年複合', G.g === null ? '—' : pct(G.g), cls(G.g))}
    ${kv(G.bank ? '負債比（銀行不適用）' : '負債比', G.debt === null ? '—' : G.debt.toFixed(0) + '%')}
    ${G.bank ? '' : kv('毛利率', G.gm === null ? '—' : G.gm.toFixed(0) + '%') + kv('營益率', G.om === null ? '—' : G.om.toFixed(0) + '%', cls(G.om)) + kv('自由現金流為正', G.fcfPos + '／' + F.n + ' 年')}
  </div>
  <ul class="pts">${G.pts.map(p => `<li class="${p[0] > 0 ? 'up' : 'dn'}">${esc(p[1])}</li>`).join('') || '<li class="mut">沒有特別突出或明顯弱點的項目</li>'}</ul>
  <div class="note">EPS：${seq(F.S.eps, 2)}　｜　毛利率：${seq(F.M.gm)}%　｜　ROE：${seq(F.M.roe)}%${G.bank ? '<br>銀行業的毛利率、自由現金流、負債比算法不適用，只看 ROE 與營收。' : ''}</div>
  <div class="note">體質評分：ROE、營收成長、營益率、負債比、自由現金流各項加減分，5 分以上「強」、1～4「中」、0 以下「弱」。
    <a href="https://eason-237588.github.io/tw-stock-analysis-f3f9488f/#${id}" target="_blank" rel="noopener" style="color:var(--blue)">看完整財報分析 ›</a></div>`;
  }

  /* ── K 棒圖：K 棒與背景依主策略上色（紅＝持有、綠＝空手），照台股趨勢儀表板不畫濾網線與進出點 ── */
  const RANGES = [['3月', 63], ['6月', 126], ['1年', 250], ['3年', 0]];
  let RNG = LS.get('tsa-rng', 126), LINE = false;
  function drawChart(cv, B, pos) {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const s0 = idxOf(B, CFG.START), s = RNG ? Math.max(s0, B.length - RNG) : s0, X = B.slice(s), P = pos.slice(s), n = X.length;
    let lo = Infinity, hi = -Infinity; X.forEach(b => { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); });
    const pad = (hi - lo) * 0.04; lo -= pad; hi += pad;
    const pl = 2, pr = 46, pt = 6, pb = 18, cw = (w - pl - pr) / n, x = i => pl + cw * (i + 0.5), y = v => pt + (h - pt - pb) * (1 - (v - lo) / (hi - lo || 1));
    for (let i = 0; i < n; i++) { g.fillStyle = P[i] > 0 ? 'rgba(198,40,40,.16)' : 'rgba(27,127,59,.14)'; g.fillRect(pl + cw * i, pt, cw + 0.6, h - pt - pb); }
    g.strokeStyle = '#2a3542'; g.lineWidth = 1; g.font = '10px Consolas, monospace'; g.fillStyle = '#8b98a5'; g.textAlign = 'left';
    for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, yy = y(v); g.beginPath(); g.moveTo(pl, yy); g.lineTo(w - pr, yy); g.stroke(); g.fillText(v >= 100 ? v.toFixed(0) : v.toFixed(1), w - pr + 4, yy + 3); }
    const bw = Math.max(1, Math.min(9, cw * 0.7));
    if (LINE) {   // 基金只有淨值：畫線，每段依主策略上色
      g.lineWidth = 1.6;
      for (let i = 1; i < n; i++) { g.strokeStyle = P[i] > 0 ? '#ff4d4d' : '#2ecc71'; g.beginPath(); g.moveTo(x(i - 1), y(X[i - 1].c)); g.lineTo(x(i), y(X[i].c)); g.stroke(); }
    } else for (let i = 0; i < n; i++) {
      const b = X[i], col = P[i] > 0 ? '#ff4d4d' : '#2ecc71', cx = x(i);
      g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1;
      g.beginPath(); g.moveTo(cx, y(b.h)); g.lineTo(cx, y(b.l)); g.stroke();
      const top = y(Math.max(b.o, b.c)), bot = y(Math.min(b.o, b.c)), hh = Math.max(1, bot - top);
      if (b.c >= b.o && bw >= 3) { g.fillStyle = '#0f1419'; g.fillRect(cx - bw / 2, top, bw, hh); g.strokeRect(cx - bw / 2 + .5, top + .5, bw - 1, Math.max(0, hh - 1)); }
      else g.fillRect(cx - bw / 2, top, bw, hh);
    }
    g.fillStyle = '#8b98a5'; g.textAlign = 'center'; let lm = '';
    const step = n > 300 ? 6 : (n > 130 ? 2 : 1);
    X.forEach((b, i) => { const m = b.d.slice(0, 7); if (m !== lm) { const mm = +b.d.slice(5, 7); if ((mm - 1) % step === 0 && x(i) > 14 && x(i) < w - pr - 10) g.fillText(mm === 1 ? b.d.slice(0, 4) : mm + '月', x(i), h - 4); lm = m; } });
  }
  function chartRanges(B, pos) {
    const el = $('#rng'); if (!el) return;
    el.innerHTML = RANGES.map(r => `<button class="rb${r[1] === RNG ? ' on' : ''}" data-n="${r[1]}">${r[0]}</button>`).join('');
    el.onclick = e => { const b = e.target.closest('.rb'); if (!b) return; RNG = +b.dataset.n; LS.set('tsa-rng', RNG); chartRanges(B, pos); drawChart($('#cv'), B, pos); };
  }

  /* ── 畫面：總表 ── */
  async function runAll() {
    const btn = $('#allRun'); btn.disabled = true; const out = $('#allOut'); out.innerHTML = '';
    for (const id of WATCH) {
      // 分格（使用者 2026-10-26 要求「重新分格、不翻頁」）：兩欄小格，格高平分畫面剩下的高度
      const info = NAME[id] || [id, id], el = document.createElement('div'); el.className = 'tile'; el.innerHTML = `<div class="t1"><span class="nm">${esc(info[1])}</span></div><div class="ln mut">讀取中…</div>`; out.appendChild(el);
      try {
        const { R } = await analyzeTrend(id), m = R.rfl, a = m.all;
        el.classList.add(m.now > 0 ? 'on' : 'off');
        el.innerHTML = `<div class="t1">${badge(m.now)}<span class="nm">${esc(info[1])}</span>${CFG.OBSERVE[id] ? '<span class="obs">觀察用</span>' : ''}</div>
          <div class="ln mut">${id.length <= 6 ? id + '・' : ''}${md(m.since)} 起${m.now ? ' ' + pct(m.chg, 1) : ''}</div>
          <div class="ln">策略 <span class="${cls(a.ret)}">${pct(a.ret)}</span>／抱 <span class="${cls(a.bh)}">${pct(a.bh)}</span></div>
          <div class="ln mut">回落 ${pctU(a.mdd)}／${pctU(a.bhMdd)}${m.h1.ret > 0 && m.h2.ret > 0 ? ' <b class="two">兩段賺</b>' : ''}</div>`;
        el.onclick = () => { switchPg('one'); show(id); };
      } catch (e) { el.innerHTML = `<div class="t1"><span class="nm">${esc(info[1])}</span></div><div class="ln err">${esc(e.message)}</div>`; }
    }
    $('#allNote').textContent = `自選 ${WATCH.length} 檔・主策略 RF 只做多・紅框＝做多・點格子看細節`;
    btn.disabled = false;
  }
  $('#allRun').onclick = runAll;

  /* ── 有機會做多：讀每日掃描結果 chance.json（每日掃描.py 收盤後產生），有新結果時分頁按鈕閃爍 ── */
  let CH = null;
  async function loadChance() {
    try {
      const j = await (await fetch('chance.json?t=' + Date.now(), { cache: 'no-store' })).json();
      CH = j; const n = (j.picks || []).length, seen = LS.get('tsa-ch-seen', '');
      $('#chCnt').hidden = !n; $('#chCnt').textContent = n;
      $('#tabChance').classList.toggle('blink', n > 0 && seen !== j.date && $('#pg-chance').hidden);
      if (!$('#pg-chance').hidden) { drawChance(); LS.set('tsa-ch-seen', j.date); }
    } catch (e) { CH = CH || { err: '還沒有掃描結果（每日收盤後由電腦產生）' }; if (!$('#pg-chance').hidden) drawChance(); }
  }
  function drawChance() {
    const j = CH, out = $('#chOut');
    if (!j || j.err) { out.innerHTML = `<div class="err">${esc((j && j.err) || '讀取中…')}</div>`; return; }
    const P = j.picks || [];
    const card = x => { const f = x.fin, b = x.bt;
      return `<div class="pick" data-id="${x.id}"><div class="t"><span class="badge long">做多</span><span class="nm">${esc(x.name)}</span><span class="id">${x.id}${x.mkt === 'O' ? '　上櫃' : '　上市'}</span>
        <span class="px ${cls(x.chg)}">${num(x.close, x.close < 100 ? 2 : 1)} <small>${pct(x.chg, 1)}</small></span></div>
        <div class="ln">體質 <span class="grade ${f.lv === '強' ? 'g3' : 'g2'}">${f.lv}</span>　ROE <b>${f.roe === null ? '—' : f.roe + '%'}</b>（平均 ${f.roeA === null ? '—' : f.roeA + '%'}）　營收五年 <b>${f.g === null ? '—' : pct(f.g)}</b>${f.bank ? '' : `　營益率 <b>${f.om === null ? '—' : f.om + '%'}</b>　負債比 <b>${f.debt === null ? '—' : f.debt + '%'}</b>`}</div>
        <div class="ln">${f.pts.map(p => esc(p[1])).join('；')}</div>
        ${b ? `<div class="ln">近 3 年主策略 <b class="${cls(b.ret)}">${pct(b.ret)}</b>（抱著 ${pct(b.bh)}）　最慘回落 ${pctU(b.mdd)}／${pctU(b.bhMdd)}　${b.n} 筆</div>` : ''}</div>`; };
    out.innerHTML = `<div class="note" style="margin-bottom:8px"><b>${ymd(j.date)}</b> 收盤掃描（${esc(j.gen)} 產生）：上市櫃 ${j.n_scan} 檔，主策略轉做多 <b>${j.n_flip}</b> 檔，其中財報體質強 <b class="up">${P.length}</b> 檔。
      大盤目前 ${j.ix_long ? '<b class="up">多方</b>' : '<b class="dn">空方</b>'}（${md(j.ix_since)} 起），僅供參考，主策略不看大盤。</div>
      ${P.length ? P.map(card).join('') : '<div class="loading">這一天沒有財報體質強又剛轉做多的股票。</div>'}
      <details><summary>轉多但沒入選（${(j.rejects || []).length} 檔）</summary><div class="rej">${(j.rejects || []).map(r => `${esc(r.name)} ${r.id}：${esc(r.why)}`).join('<br>')}</div></details>
      <div class="note" style="margin-top:8px">篩選條件：${esc(j.rule)}。點一檔看個股細節。這是數據篩選，不是買賣建議。</div>`;
    out.querySelectorAll('.pick').forEach(el => { el.onclick = () => { switchPg('one'); show(el.dataset.id); }; });
  }
  setInterval(() => { if (!document.hidden) loadChance(); }, 5 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadChance(); });

  /* ── 搜尋與分頁 ── */
  function suggest(q) {
    q = q.trim(); if (!q) return [];
    const Q = q.toUpperCase();
    return EXTRA.concat(STOCKS).filter(s => s[0].startsWith(Q) || s[1].includes(q)).slice(0, 12);
  }
  $('#q').oninput = () => {
    const L = suggest($('#q').value), box = $('#sug');
    box.innerHTML = L.map(s => `<div data-id="${s[0]}"><b>${s[0]}</b>${esc(s[1])}<i>${({ O: '上櫃', L: '上市', I: '指數', F: '基金' })[s[2]] || ''}</i></div>`).join('');
    box.hidden = !L.length;
  };
  $('#q').onkeydown = e => { if (e.key === 'Enter') { const L = suggest($('#q').value); if (L.length) show(L[0][0]); else if (ID_RE.test($('#q').value.trim().toUpperCase())) show($('#q').value.trim()); } };
  $('#sug').onclick = e => { const d = e.target.closest('[data-id]'); if (d) show(d.dataset.id); };
  function switchPg(pg) {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.pg === pg));
    $('#pg-one').hidden = pg !== 'one'; $('#pg-all').hidden = pg !== 'all'; $('#pg-chance').hidden = pg !== 'chance';
    if (pg === 'chance') { $('#tabChance').classList.remove('blink'); drawChance(); if (CH && CH.date) LS.set('tsa-ch-seen', CH.date); }
    if (pg === 'all' && !$('#allOut').children.length) runAll();
  }
  document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => switchPg(b.dataset.pg); });

  $('#bv').textContent = 'v' + BUILD_NO; document.title = '台股策略分析 v' + BUILD_NO;
  $('#ver2').textContent = `（${BUILD_NAME}）版本編號:${BUILD_NO}`;
  /* ── 新版本檢查：每分鐘比對線上 version.json，有新版跳提示（GitHub Pages 約 10 分鐘內生效）── */
  async function checkVer() {
    try {
      const j = await (await fetch(CFG.VER_URL + '?t=' + Date.now(), { cache: 'no-store' })).json();
      if (j.no && +j.no > +BUILD_NO && !$('#newver')) {
        const d = document.createElement('div'); d.id = 'newver';
        d.innerHTML = `已有新版本 v${esc(j.no)}，點此更新`;
        d.onclick = () => { location.href = location.pathname + '?v=' + j.no + Date.now() + location.hash; };
        document.body.appendChild(d);
      }
    } catch (e) { /* 離線或單檔版沒網路就略過 */ }
  }
  setInterval(() => { if (!document.hidden) checkVer(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVer(); });
  setTimeout(checkVer, 3000);

  window.addEventListener('hashchange', () => { const x = location.hash.replace('#', ''); if (ID_RE.test(x) && x !== CUR) show(x); });
  drawChips(); loadChance();
  const h = location.hash.replace('#', '');
  show(ID_RE.test(h) ? h : WATCH[0] || '2330');
  // 總表格子要扣掉標題列高度才放得進一頁；標題列在窄螢幕可能換行，用量的
  const topH = () => document.documentElement.style.setProperty('--toph', $('.top').offsetHeight + 'px');
  topH(); addEventListener('resize', topH);
  switchPg('all');   // 打開時先停在總表（個股在背景載好，切過去不用等）
})();
</script>
</body>
